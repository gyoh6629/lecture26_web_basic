<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Dongle&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Dongle",'궁서';
            font-size: 2em;
        }
        div {
            position: relative;
            width: 200px;
            height: 200px;
            border-width: 100px;
            border-color: aqua;
        }
        .div01 {
            left: 50px;
            z-index: 10;
            background-color: red;
            text-align: center;
            border-width: 10px;
            border-color: aqua;
            border-style: solid;
            border-radius: 25%;
        }
        .div02 {
            position: fixed;
            bottom: 100px;
            right: 100px;
            background-color: blue;
            border-style: dotted;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="div01">첫번째 사각형</div>
