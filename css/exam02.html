<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            position: absolute;
            width: 200px;
            height: 200px;
            left: 50px;
        }
        .div01 {
            background-color: red;
            z-index: 10;
        }
        .div02 {
            left: 80px;
            background-color: blue;
        }
        .div03 {
            width: 300px;
            height: 300px;
            top: 300px;
            left: 100px;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <div class="div01">첫번째 사각형</div>
    <div class="div02">두번째 사각형</div>
    <div class="div03">
        <div class="div01"></div>
    </div>
</body>
</html>
