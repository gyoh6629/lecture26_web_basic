<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        document.write("< 1 - 50 숫자중 십의 자리 짝수면서 일의 자리 홀수고, 3의 배수인 숫자 출력><br>");
        count = 0;
        for(let i=10; i<=50; ++i){
            temp_count = 0;
            temp = i;
            while(temp >= 10){
                temp -= 10;
                temp_count += 1;
            }
            if(i % 2 == 1 && temp_count % 2 == 0){
                document.write(i);
                document.write(" ");
                count += 1;
            }
        }
        document.write(`<br>총 개수 : ${count}개`);
        
    </script>
</head>
<body>
    
</body>
</html>
