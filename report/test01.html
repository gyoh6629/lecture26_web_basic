<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let num = parseInt(prompt("정수를 입력하세요 : "));
        document.write(`<1 ~ ${num} 사이의 정수값을 한라인에 5개씩 출력하기><br>`);
        let count = 0;
        for(let i=1; i<=num; ++i){
            document.write(i);
            count += 1;
            if (count == 5){
                document.write("<br>");
                count = 0;
            }
            else{
                document.write(" ");
            }
        }
        document.write(` < ${num}의 약수 출력><br>`);
        for(let j=1; j<=num; ++j){
            if(num % j == 0){
                document.write(j + " ");
            }
        }
        
    </script>
</head>
<body>
    
</body>
</html>
