<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let a = 10
        let b = a

        b = b + 200

        document.write(`a : ${a}<br>`)
        document.write(`b : ${b}<br>`)

        let arr = [10, 20, 30, 40, 50]
        // let copy_arr = arr // shallow copy(얕은복사) 실제 배열은 하나, 힙, 주소만 같음

        // deep copy(깊은복사) 새로운 배열 하나 더만듦
        /* 방법 1
        let copy_arr = []
        for(let data of arr){
            copy_arr.push(data)
        }
        */
        /* 방법 2
        let copy_arr = arr.map(function(element){
                return element
        })
           방법 2-1
        let copy_arr = arr.map((element) => element)
        */
        /* 방법 3
        let copy_arr = [...arr] ... : 전개연산자
        */
        copy_arr[2] = 1000
        
        document.write(`arr : ${arr}<br>`)
        document.write(`copy_arr : ${copy_arr}<br>`)
    </script>
</head>

</body>
</html>
